<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" role="img" aria-labelledby="title desc">
<title id="title">TaskPulse architecture — from agent evidence to trustworthy reminders</title>
<desc id="desc">Native and WSL providers have independent workers; SSH has a remote polling thread and legacy files are read by the watcher. Facts flow through scope, TaskStore, AttentionTracker and TransitionEngine. Only the Generic Event lane uses Journal, Checkpoint and Outbox; acknowledgment follows durable state flush, not proof of visible delivery.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0c1b26"/><stop offset="1" stop-color="#111421"/></linearGradient>
<linearGradient id="card" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#172b34"/><stop offset="1" stop-color="#18222e"/></linearGradient>
<marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#6dd8cb" stroke-width="1.5"/></marker>
<filter id="shadow" x="-20%" y="-40%" width="140%" height="180%"><feDropShadow dx="0" dy="8" stdDeviation="15" flood-color="#020a10" flood-opacity=".26"/></filter>
</defs>
<rect width="1280" height="800" rx="28" fill="url(#bg)"/>
<g font-family="Segoe UI, Inter, Arial, sans-serif">
<text x="66" y="66" font-size="34" font-weight="750" fill="#eaf7f7">TaskPulse</text>
<text x="264" y="64" font-size="18" fill="#82aeb9">Architecture</text>
<text x="67" y="101" font-size="17" fill="#a0b5bb">Observe real lifecycle evidence. Keep uncertainty visible. Notify only on meaningful transitions.</text>
<rect x="1015" y="45" width="198" height="37" rx="19" fill="#163936" stroke="#3cae9f" stroke-opacity=".5"/>
<text x="1114" y="69" text-anchor="middle" fill="#86eee0" font-size="13" font-weight="700">LOCAL-FIRST · WINDOWS</text>
<text x="67" y="148" font-size="14" fill="#72d7c7" letter-spacing="2" font-weight="700">01  EVIDENCE SOURCES</text>
<g filter="url(#shadow)">
<rect x="65" y="169" width="352" height="126" rx="15" fill="url(#card)" stroke="#30545e"/>
<rect x="464" y="169" width="352" height="126" rx="15" fill="url(#card)" stroke="#30545e"/>
<rect x="863" y="169" width="352" height="126" rx="15" fill="url(#card)" stroke="#30545e"/>
</g>
<circle cx="94" cy="199" r="5" fill="#6ce0d0"/>
<text x="109" y="205" font-size="20" font-weight="700" fill="#f0fbfc">Local coding agents</text>
<text x="91" y="238" font-size="15" fill="#c2d2d5">Codex · Claude Code · Hermes</text>
<text x="91" y="261" font-size="14" fill="#9eb6bd">DeepSeek Harness · native logs / hooks</text>
<circle cx="492" cy="199" r="5" fill="#8cb7ff"/>
<text x="507" y="205" font-size="20" font-weight="700" fill="#f0fbfc">Cross-environment</text>
<text x="490" y="238" font-size="15" fill="#c2d2d5">WSL Ubuntu · SSH hosts · tmux</text>
<text x="490" y="261" font-size="14" fill="#9eb6bd">Read-only session and process evidence</text>
<circle cx="891" cy="199" r="5" fill="#e9bb72"/>
<text x="906" y="205" font-size="20" font-weight="700" fill="#f0fbfc">Community integrations</text>
<text x="890" y="238" font-size="15" fill="#c2d2d5">Standard Events v1 · Manifest</text>
<text x="890" y="261" font-size="14" fill="#9eb6bd">Explicit capability / trust boundaries</text>
<g stroke="#69cfc5" stroke-width="2" opacity=".85" marker-end="url(#arrow)">
<path d="M242 298 V330"/><path d="M640 298 V330"/><path d="M1039 298 V330"/>
</g>
<rect x="65" y="335" width="1150" height="97" rx="17" fill="#173834" stroke="#38998f" stroke-width="1.5"/>
<text x="94" y="374" font-size="22" font-weight="750" fill="#e2fcf7">Provider collection</text>
<text x="94" y="401" font-size="16" fill="#acd5d0">Independent native / WSL workers · remote polling thread · legacy files in watcher · fresh / stale evidence</text>
<path d="M640 432 V475 H194 V481" fill="none" stroke="#69cfc5" stroke-width="2" marker-end="url(#arrow)"/>
<text x="67" y="468" font-size="14" fill="#72d7c7" letter-spacing="2" font-weight="700">02  RECONCILE &amp; ACT</text>
<g filter="url(#shadow)">
<rect x="65" y="484" width="258" height="112" rx="15" fill="#1b2936" stroke="#3c5861"/>
<rect x="362" y="484" width="258" height="112" rx="15" fill="#1b2936" stroke="#3c5861"/>
<rect x="659" y="484" width="258" height="112" rx="15" fill="#1b2936" stroke="#3c5861"/>
<rect x="956" y="484" width="258" height="112" rx="15" fill="#1b2936" stroke="#3c5861"/>
</g>
<text x="87" y="517" font-size="20" font-weight="750" fill="#eaf8f8">Scope &amp; normalize</text>
<text x="87" y="543" font-size="14" fill="#a8c0c7">source / project filters</text>
<text x="87" y="563" font-size="14" fill="#a8c0c7">session · turn · request IDs</text>
<text x="384" y="517" font-size="20" font-weight="750" fill="#eaf8f8">TaskStore</text>
<text x="384" y="543" font-size="14" fill="#a8c0c7">merge by stable identity</text>
<text x="384" y="563" font-size="14" fill="#a8c0c7">preserve uncertain facts</text>
<text x="681" y="517" font-size="20" font-weight="750" fill="#eaf8f8">AttentionTracker</text>
<text x="681" y="543" font-size="14" fill="#a8c0c7">unread · pinned · recovery</text>
<text x="681" y="563" font-size="14" fill="#a8c0c7">user attention survives</text>
<text x="978" y="517" font-size="20" font-weight="750" fill="#eaf8f8">TransitionEngine</text>
<text x="978" y="543" font-size="14" fill="#a8c0c7">meaningful transitions</text>
<text x="978" y="563" font-size="14" fill="#a8c0c7">idempotent notice decisions</text>
<g stroke="#69cfc5" stroke-width="2" marker-end="url(#arrow)">
<path d="M325 540 H355"/><path d="M622 540 H652"/><path d="M919 540 H949"/>
</g>
<path d="M1085 596 V621 H640 V655" stroke="#69cfc5" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="65" y="618" width="445" height="93" rx="15" fill="#1d2633" stroke="#384f69"/>
<text x="87" y="649" font-size="17" font-weight="700" fill="#d7e6ff">Generic Event lane only</text>
<text x="87" y="675" font-size="14" fill="#acbfd7">CLI → Journal → reducer / Checkpoint / Outbox</text>
<text x="87" y="695" font-size="12" fill="#88a0ba">Ordered facts enter above; ack after durable state flush</text>
<rect x="541" y="655" width="673" height="86" rx="15" fill="#142e34" stroke="#328f92"/>
<text x="563" y="690" font-size="20" fill="#e5fafa" font-weight="750">Tray · dashboard · message center · reminders</text>
<text x="563" y="715" font-size="14" fill="#9ad0cb">Message seen ≠ result viewed ≠ request resolved · stale stays uncertain</text>
<text x="66" y="771" font-size="13" fill="#8fa8b1">Illustrative architecture — not a live screen or proof of host support. Upstream: sprklai/agenttray · MIT</text>
</g>
</svg>
