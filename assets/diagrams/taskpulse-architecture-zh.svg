<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" role="img" aria-labelledby="title desc">
<title id="title">TaskPulse 工作原理：从来源证据到可信提醒</title>
<desc id="desc">本机与 WSL 使用独立采集线程，SSH 独立轮询，兼容文件由监控主循环读取。经过范围筛选、任务状态合并、关注列表和事件判定后展示。仅标准事件通道使用日志、检查点和待确认队列；持久化确认不代表用户已查看。</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0c1b26"/><stop offset="1" stop-color="#111421"/></linearGradient>
<linearGradient id="card" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#172b34"/><stop offset="1" stop-color="#18222e"/></linearGradient>
<marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#6dd8cb" stroke-width="1.5"/></marker>
<filter id="shadow" x="-20%" y="-40%" width="140%" height="180%"><feDropShadow dx="0" dy="8" stdDeviation="15" flood-color="#020a10" flood-opacity=".26"/></filter>
</defs>
<rect width="1280" height="800" rx="28" fill="url(#bg)"/>
<g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, Segoe UI, sans-serif">
<text x="66" y="66" font-size="34" font-weight="750" fill="#eaf7f7">TaskPulse</text>
<text x="264" y="64" font-size="18" fill="#82aeb9">工作原理</text>
<text x="67" y="101" font-size="17" fill="#a0b5bb">采集明确事件，保留不确定状态，在需要关注时提醒。</text>
<rect x="1015" y="45" width="198" height="37" rx="19" fill="#163936" stroke="#3cae9f" stroke-opacity=".5"/>
<text x="1114" y="69" text-anchor="middle" fill="#86eee0" font-size="13" font-weight="700">本机优先 · Windows</text>
<text x="67" y="148" font-size="14" fill="#72d7c7" letter-spacing="2" font-weight="700">01  任务来源</text>
<g filter="url(#shadow)">
<rect x="65" y="169" width="352" height="126" rx="15" fill="url(#card)" stroke="#30545e"/>
<rect x="464" y="169" width="352" height="126" rx="15" fill="url(#card)" stroke="#30545e"/>
<rect x="863" y="169" width="352" height="126" rx="15" fill="url(#card)" stroke="#30545e"/>
</g>
<circle cx="94" cy="199" r="5" fill="#6ce0d0"/>
<text x="109" y="205" font-size="20" font-weight="700" fill="#f0fbfc">本机 Coding Agent</text>
<text x="91" y="238" font-size="15" fill="#c2d2d5">Codex · Claude Code · Hermes</text>
<text x="91" y="261" font-size="14" fill="#9eb6bd">DeepSeek Harness · 原生日志 / Hook</text>
<circle cx="492" cy="199" r="5" fill="#8cb7ff"/>
<text x="507" y="205" font-size="20" font-weight="700" fill="#f0fbfc">跨环境任务</text>
<text x="490" y="238" font-size="15" fill="#c2d2d5">WSL 发行版 · SSH 主机 · tmux</text>
<text x="490" y="261" font-size="14" fill="#9eb6bd">只读会话记录与进程证据</text>
<circle cx="891" cy="199" r="5" fill="#e9bb72"/>
<text x="906" y="205" font-size="20" font-weight="700" fill="#f0fbfc">更多 Agent 接入</text>
<text x="890" y="238" font-size="15" fill="#c2d2d5">标准事件 v1 · 声明式适配</text>
<text x="890" y="261" font-size="14" fill="#9eb6bd">明确事件能力与证据来源</text>
<g stroke="#69cfc5" stroke-width="2" opacity=".85" marker-end="url(#arrow)">
<path d="M242 298 V330"/><path d="M640 298 V330"/><path d="M1039 298 V330"/>
</g>
<rect x="65" y="335" width="1150" height="97" rx="17" fill="#173834" stroke="#38998f" stroke-width="1.5"/>
<text x="94" y="374" font-size="22" font-weight="750" fill="#e2fcf7">来源采集</text>
<text x="94" y="401" font-size="16" fill="#acd5d0">本机 / WSL 独立采集线程 · SSH 独立轮询 · 兼容状态文件 · 标记来源健康与数据新鲜度</text>
<path d="M640 432 V475 H194 V481" fill="none" stroke="#69cfc5" stroke-width="2" marker-end="url(#arrow)"/>
<text x="67" y="468" font-size="14" fill="#72d7c7" letter-spacing="2" font-weight="700">02  统一状态与关注</text>
<g filter="url(#shadow)">
<rect x="65" y="484" width="258" height="112" rx="15" fill="#1b2936" stroke="#3c5861"/>
<rect x="362" y="484" width="258" height="112" rx="15" fill="#1b2936" stroke="#3c5861"/>
<rect x="659" y="484" width="258" height="112" rx="15" fill="#1b2936" stroke="#3c5861"/>
<rect x="956" y="484" width="258" height="112" rx="15" fill="#1b2936" stroke="#3c5861"/>
</g>
<text x="87" y="517" font-size="20" font-weight="750" fill="#eaf8f8">范围筛选与归一化</text>
<text x="87" y="543" font-size="14" fill="#a8c0c7">按来源、项目过滤</text>
<text x="87" y="563" font-size="14" fill="#a8c0c7">保持会话、轮次与请求身份</text>
<text x="384" y="517" font-size="20" font-weight="750" fill="#eaf8f8">任务状态合并</text>
<text x="384" y="543" font-size="14" fill="#a8c0c7">按稳定 ID 合并来源证据</text>
<text x="384" y="563" font-size="14" fill="#a8c0c7">失联不等于完成</text>
<text x="681" y="517" font-size="20" font-weight="750" fill="#eaf8f8">关注列表管理</text>
<text x="681" y="543" font-size="14" fill="#a8c0c7">未查看 · 固定 · 重启恢复</text>
<text x="681" y="563" font-size="14" fill="#a8c0c7">保留用户关注记录</text>
<text x="978" y="517" font-size="20" font-weight="750" fill="#eaf8f8">事件提醒判定</text>
<text x="978" y="543" font-size="14" fill="#a8c0c7">仅对明确状态变化提醒</text>
<text x="978" y="563" font-size="14" fill="#a8c0c7">相同事件去重，避免重复打扰</text>
<g stroke="#69cfc5" stroke-width="2" marker-end="url(#arrow)">
<path d="M325 540 H355"/><path d="M622 540 H652"/><path d="M919 540 H949"/>
</g>
<path d="M1085 596 V621 H640 V655" stroke="#69cfc5" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="65" y="618" width="445" height="93" rx="15" fill="#1d2633" stroke="#384f69"/>
<text x="87" y="649" font-size="17" font-weight="700" fill="#d7e6ff">仅标准事件接入通道</text>
<text x="87" y="675" font-size="12" fill="#acbfd7">CLI / MCP → 事件日志 → 归约 / 检查点 / 待确认队列</text>
<text x="87" y="695" font-size="12" fill="#88a0ba">有序事件进入上方处理链路；状态持久化后确认消费</text>
<rect x="541" y="655" width="673" height="86" rx="15" fill="#142e34" stroke="#328f92"/>
<text x="563" y="690" font-size="20" fill="#e5fafa" font-weight="750">托盘 · 任务面板 · 消息中心 · 弹窗提醒</text>
<text x="563" y="715" font-size="14" fill="#9ad0cb">消息已读 ≠ 结果已查看 ≠ 请求已解决；过期状态保持待更新</text>
<text x="66" y="771" font-size="13" fill="#8fa8b1">当前桌面架构示意 · 手机端属于后续规划 · 基于 sprklai/agenttray · MIT</text>
</g>
</svg>
