<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="640" viewBox="0 0 1120 640" role="img" aria-labelledby="title desc"><title id="title">Evidence behind every reminder</title><desc id="desc">Native and remote inputs feed Watcher, TaskStore and AttentionTracker. Attention and source health feed dashboard projection and the tray. TransitionEngine feeds notifications. User actions, not state updates, trigger verified host return.</desc>
