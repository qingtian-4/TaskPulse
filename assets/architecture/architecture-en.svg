<g id="watcher"><rect x="374" y="112" width="330" height="88" rx="12" fill="white" stroke="#ccded8"/><text x="392" y="138" class="label">Bounded collection · Watcher</text><text x="392" y="161" class="detail">Budgets / generations / scope / dedup</text><text x="392" y="182" class="code">providers/ · watcher.rs</text></g>
