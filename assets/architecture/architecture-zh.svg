<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="604" viewBox="0 0 1120 604" role="img" aria-labelledby="title desc"><title id="title">让每一次提醒都有依据</title><desc id="desc">Read-only sources feed bounded collection, trusted task observations, durable attention and explicit transitions. Scoped native delivery presents snapshots and deduplicated reminders.</desc>
