<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="520" viewBox="0 0 1060 520" role="img" aria-labelledby="title description">
  <title id="title">TaskPulse: one glance across multiple coding agents</title>
  <desc id="description">Illustrative UI, not live data. A running Codex task, a Claude approval, a DeepSeek result and a separate completion reminder.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#17212a"/><stop offset="1" stop-color="#0e1116"/></linearGradient></defs>
  <rect width="1060" height="520" rx="18" fill="url(#bg)"/>
  <g font-family="Segoe UI,Microsoft YaHei,sans-serif">
    <text x="54" y="72" font-size="30" font-weight="600" fill="#e0e5e9">Stay focused. Let TaskPulse watch.</text>
    <text x="54" y="105" font-size="16" fill="#9cabb8">Multiple agents · one attention dashboard · timely reminders</text>
    <rect x="54" y="138" width="520" height="324" rx="14" fill="#1a1b1e" stroke="#ffffff" stroke-opacity=".1"/>
    <text x="76" y="171" font-size="16" letter-spacing="2" fill="#e0e5e9">TaskPulse</text>
    <text x="76" y="207" font-size="13" fill="#9bc5e1">ONGOING 2</text><text x="220" y="207" font-size="13" fill="#a5afb7">UNVIEWED 1</text>
    <path d="M54 225H574" stroke="#ffffff" stroke-opacity=".08"/>
    <circle cx="80" cy="257" r="4" fill="#7ab5e4"/><text x="97" y="262" font-size="16" fill="#e0e5e9">Review API changes</text><text x="491" y="261" font-size="12" fill="#7ab5e4">Running</text>
    <text x="97" y="286" font-size="12" fill="#909aa6">sample-app · Codex · Local</text><text x="97" y="307" font-size="12" fill="#9bc5e1">Thinking · this turn is still running</text>
    <circle cx="80" cy="338" r="4" fill="#d6be6d"/><text x="97" y="343" font-size="16" fill="#e0e5e9">Run regression tests</text><text x="465" y="342" font-size="12" fill="#d6be6d">Approval</text>
    <text x="97" y="367" font-size="12" fill="#909aa6">sample-app · Claude Code · Local</text>
    <circle cx="80" cy="400" r="4" fill="#35a475"/><text x="97" y="405" font-size="16" fill="#e0e5e9">Refine the dashboard</text><text x="473" y="404" font-size="12" fill="#35a475">Turn ended</text>
    <text x="97" y="430" font-size="12" fill="#909aa6">sample-ui · DeepSeek Harness · Local</text>
    <text x="625" y="191" font-size="18" fill="#e0e5e9">No need to keep it on top.</text>
    <text x="625" y="219" font-size="14" fill="#9cabb8">Return when a result needs your attention.</text>
    <rect x="625" y="249" width="380" height="156" rx="10" fill="#1a1b1e" stroke="#ffffff" stroke-opacity=".1"/>
    <rect x="641" y="267" width="32" height="32" rx="8" fill="#8cb5c9" fill-opacity=".12"/>
    <path d="M646 283h5l3-8 5 18 3-10h6" stroke="#8cb5c9" fill="none" stroke-width="1.5"/>
    <text x="686" y="280" font-size="11" fill="#909aa6">DeepSeek · Local · sample-ui</text>
    <text x="686" y="306" font-size="16" font-weight="600" fill="#e0e5e9">Refine the dashboard</text>
    <text x="686" y="332" font-size="13" fill="#35a475">Turn ended · waiting for your next input</text>
    <path d="M625 353H1005" stroke="#ffffff" stroke-opacity=".08"/>
    <text x="641" y="382" font-size="11" fill="#909aa6">Dismiss does not mark viewed</text><text x="897" y="382" font-size="12" fill="#9bc5e1">View details ↗</text>
    <text x="54" y="494" font-size="12" fill="#8996a0">Illustrative example · not a screenshot or live monitoring data · Windows Alpha</text>
  </g>
</svg>
