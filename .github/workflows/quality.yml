name: Windows quality

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main, 'codex/**']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  quality:
    name: Windows Rust and frontend
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.0"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "1.98.0"
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
      - name: Install locked frontend dependencies
        run: bun install --frozen-lockfile
      - name: Audit frontend dependencies (moderate and above)
        run: bun run audit:frontend
      # Separate native-command steps: PowerShell must not let a later success
      # mask an earlier failed fmt/lint/test exit code.
      - name: Check frontend types
        run: bun run check
      - name: Test development workflow and artifact boundaries
        run: bun run test:workflow
      - name: Test installation preview contracts
        run: bun run test:installation-preview
      - name: Test documentation links and candidate source instructions
        run: bun run test:docs
      - name: Audit tracked documentation, media and ignored outputs
        run: bun run test:repo
      - name: Test frontend models
        run: bun run test:ui-model
      - name: Validate release versions
        run: bun run release:check
      - name: Test release validation
        # Bun starts Windows PowerShell fixtures; keep Desktop module paths.
        shell: powershell
        run: bun run test:release
      - name: Test security report validation
        run: bun run test:security
      - name: Test integration contracts
        run: bun run test:integration-contract
      - name: Test smoke evidence and bounded owned-directory cleanup
        run: bun run test:smoke-cleanup
      - name: Test read-only WSL source detection (offline fixtures)
        run: python tests/test-wsl-discovery.py
      - name: Test remote Codex metadata schemas (offline fixtures)
        run: python tests/test-codex-metadata.py
      - name: Test SSH source capability detection (offline fixtures)
        run: python tests/test-ssh-sources.py
      - name: Test WSL metadata freshness and read failures (offline fixtures)
        run: python tests/wsl-metadata.test.py
      - name: Test opt-in Codex approval observer and reversible installation
        run: python tests/test-codex-observer.py
      - name: Test public installation manifest/source validation
        run: python tests/test-public-install.py
      - name: Build frontend
        run: bun run build
      - name: Check Rust format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Lint Rust
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --bin agent-tray -- -D warnings
      - name: Test Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml --bin agent-tray
      - name: Build executable
        run: cargo build --locked --manifest-path src-tauri/Cargo.toml --bin agent-tray --features custom-protocol
      - name: Test integration bridge in an isolated home
        run: bun tests/native/integration-bridge-smoke.ts --exe src-tauri/target/debug/agent-tray.exe
      - name: Test source-bound MCP with the native executable
        run: python tests/native/mcp-smoke.py --exe src-tauri/target/debug/agent-tray.exe
      # Opt-in live Agent/SSH/WSL and GUI acceptance tests are not unattended CI.
      # No tags, installers, release publication or write-capable token here.
      - name: Verify default development isolation as a real standard Windows account
        shell: powershell
        run: |
          $bun = (Get-Command bun.exe).Source
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests/native/native-standard-user.ps1 -Bun $bun -Exe src-tauri/target/debug/agent-tray.exe
          if ($LASTEXITCODE -ne 0) { throw 'Native standard-account verification failed' }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: development-evidence-windows-x64-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            src-tauri/target/ui-smoke/evidence/development-native-*/
            src-tauri/target/ui-smoke/evidence/standard-user-*/
          retention-days: 7
          if-no-files-found: warn
      - name: Stage a portable development build
        env:
          SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bun scripts/development-artifact.ts --exe src-tauri/target/debug/agent-tray.exe --out dist/development --commit "$env:SOURCE_COMMIT"
      - name: Export development dependency notices
        run: bun scripts/dependency-notices.ts dist/development x86_64-pc-windows-msvc
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        id: development
        with:
          name: taskpulse-dev-windows-x64-${{ github.event.pull_request.head.sha || github.sha }}
          path: dist/development/
          retention-days: 7
          if-no-files-found: error
      - name: Link the temporary build in the run summary
        env:
          ARTIFACT_URL: ${{ steps.development.outputs.artifact-url }}
          ARTIFACT_DIGEST: ${{ steps.development.outputs.artifact-digest }}
        run: |
          "### TaskPulse Dev (expires in 7 days)" >> $env:GITHUB_STEP_SUMMARY
          "[Download the portable Windows build]($env:ARTIFACT_URL)" >> $env:GITHUB_STEP_SUMMARY
          "ZIP SHA-256: $env:ARTIFACT_DIGEST" >> $env:GITHUB_STEP_SUMMARY
          "Extract into a new directory and run TaskPulse.exe. No installation or production data migration." >> $env:GITHUB_STEP_SUMMARY
