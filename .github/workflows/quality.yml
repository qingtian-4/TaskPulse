name: Windows quality

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  quality:
    name: Windows Rust and frontend
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install locked frontend dependencies
        run: bun install --frozen-lockfile
      - name: Audit frontend dependencies (moderate and above)
        run: bun run audit:frontend
      # Separate native-command steps: PowerShell must not let a later success
      # mask an earlier failed fmt/lint/test exit code.
      - name: Check frontend types
        run: bun run check
      - name: Test frontend models
        run: bun run test:ui-model
      - name: Validate release versions
        run: bun run release:check
      - name: Test release validation
        run: bun run test:release
      - name: Test security report validation
        run: bun run test:security
      - name: Build frontend
        run: bun run build
      - name: Check Rust format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Lint Rust
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --bin agent-tray -- -D warnings
      - name: Test Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml --bin agent-tray
      - name: Build executable
        run: cargo build --locked --manifest-path src-tauri/Cargo.toml --bin agent-tray --features custom-protocol
      # Opt-in live Agent/SSH/WSL and GUI acceptance tests are not unattended CI.
      # No tags, installers, release publication or write-capable token here.
