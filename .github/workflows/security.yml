name: Security checks

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 2 * * 1'
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true

permissions:
  contents: read

jobs:
  rust:
    name: Rust advisories and yanked dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - name: Audit the exact Cargo lockfile (no ignores or stale database)
        run: bun scripts/security.ts rust
  secrets:
    name: Redacted complete Git history scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - name: Scan all refs without baselines or allow comments
        run: bun scripts/security.ts secrets
      # Never upload raw secret reports: redaction is not a privacy review.
