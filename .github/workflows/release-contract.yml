name: Release contracts
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main, 'codex/**']
    types: [opened, synchronize, reopened, labeled]
permissions:
  contents: read
concurrency:
  group: release-contract-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.0"
      - run: bun run test:docs
      - run: python3 tests/test-release-package.py
      - run: python3 tests/test-cli-install.py
      - run: python3 tests/test-public-install.py
      - run: bun test ./tests/release-package.test.ts
  arm64-build:
    name: Windows ARM64 installer preview (opt-in)
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && contains(github.event.pull_request.labels.*.name, 'test:installers') && (github.event.action != 'labeled' || github.event.label.name == 'test:installers')
    runs-on: windows-11-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.0"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "1.98.0"
          targets: aarch64-pc-windows-msvc
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Run Rust tests on native Windows ARM64
        env:
          RUST_TEST_THREADS: '1'
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --bin agent-tray --target aarch64-pc-windows-msvc
      - name: Build untagged ARM64 installer without release signing keys
        run: bun run tauri build --target aarch64-pc-windows-msvc --features custom-protocol --bundles nsis -- --profile ci-release --locked
      - name: Verify native CLI bridge on ARM64
        run: bun tests/native/integration-bridge-smoke.ts --exe src-tauri/target/aarch64-pc-windows-msvc/ci-release/TaskPulse.exe --require-gui
      - name: Stage explicitly untagged preview assets
        env:
          SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bun scripts/release.ts stage --arm64 --untagged --pr-preview --bundle-root src-tauri/target/aarch64-pc-windows-msvc/ci-release/bundle --out dist/arm64-preview --version "$((Get-Content -Raw package.json | ConvertFrom-Json).version)" --commit "$env:SOURCE_COMMIT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-arm64-preview-${{ github.event.pull_request.head.sha || github.sha }}
          path: dist/arm64-preview/*
          retention-days: 7
          if-no-files-found: error

  arm64-install:
    name: Verify ARM64 NSIS preview on a fresh runner (round ${{ matrix.round }})
    needs: [arm64-build]
    runs-on: windows-11-arm
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        round: [1, 2]
    env:
      TASKPULSE_PROBE_COMMIT: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: windows-arm64-preview-${{ github.event.pull_request.head.sha || github.sha }}
          path: dist/arm64-preview
      - name: Verify the downloaded preview matches the checked-out source
        shell: pwsh
        run: |
          $version = (Get-Content -Raw package.json | ConvertFrom-Json).version
          $manifest = Get-Content -Raw dist/arm64-preview/release-manifest.json | ConvertFrom-Json
          if ($manifest.commit -ne $env:TASKPULSE_PROBE_COMMIT -or (git rev-parse HEAD) -ne $env:TASKPULSE_PROBE_COMMIT -or $manifest.version -ne $version -or $manifest.build_kind -ne 'pr-preview' -or $null -ne $manifest.tag -or $manifest.architecture -ne 'arm64') {
            throw 'ARM64 preview identity mismatch'
          }
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV
      - name: Prepare the verified portable ARM64 de-elevation helper
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File tests/install/prepare-arm64-gsudo.ps1
      - name: Install, restart, reinstall and uninstall the ARM64 NSIS preview
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests/install/installer-smoke.ps1 -Assets dist/arm64-preview -Version "$env:RELEASE_VERSION" -Gsudo "$env:GSUDO_EXE" -InstallerKind nsis -Architecture arm64 -VerifyRenamedExecutable
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: preview-evidence-windows-arm64-nsis-${{ matrix.round }}-${{ github.event.pull_request.head.sha }}
          path: dist/installer-smoke/
          retention-days: 7
          if-no-files-found: warn
