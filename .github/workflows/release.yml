name: Windows Alpha release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing pre-release tag (must match all version files)'
        required: true
        default: 'v0.2.0-alpha.8'
      commit:
        description: 'Optional full current main SHA: CI artifacts only, overrides tag; no Tag or Release created'
        required: false
        default: ''
      probe_commit:
        description: 'Optional exact workflow SHA for probe-only candidate regression; forbidden for tagged releases'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.commit || github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: 0

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      commit: ${{ steps.version.outputs.commit }}
      probe_commit: ${{ steps.version.outputs.probe_commit }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.inputs.commit || github.event.inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.0"
      - name: Verify exact main candidate or existing tag and all application versions
        id: version
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
          CANDIDATE_COMMIT: ${{ github.event.inputs.commit }}
          PROBE_COMMIT: ${{ github.event.inputs.probe_commit }}
        run: |
          if [ -n "$PROBE_COMMIT" ]; then
            if [ -z "$CANDIDATE_COMMIT" ] || ! [[ "$PROBE_COMMIT" =~ ^[a-f0-9]{40}$ ]] || [ "$PROBE_COMMIT" != "$GITHUB_SHA" ]; then
              echo 'Probe override requires an untagged main candidate and the exact workflow SHA' >&2
              exit 1
            fi
            echo "probe_commit=$PROBE_COMMIT" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$CANDIDATE_COMMIT" ]; then
            bun scripts/release.ts candidate --commit "$CANDIDATE_COMMIT"
          else
            bun scripts/release.ts preflight --tag "$RELEASE_TAG"
          fi
      - name: Test release validation and asset handling
        run: bun test scripts/release.test.ts

  security:
    needs: preflight
    uses: ./.github/workflows/security.yml
    with:
      ref: ${{ needs.preflight.outputs.commit }}

  windows:
    name: Build Windows x64 MSVC installers
    needs: [preflight, security]
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.preflight.outputs.commit }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.0"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "1.98.0"
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
          cache-on-failure: true
      - name: Install locked frontend dependencies
        run: bun install --frozen-lockfile
      - name: Audit frontend dependencies (moderate and above)
        run: bun run audit:frontend
      # Each native command has its own step; a later success cannot hide failure.
      - name: Check frontend
        run: bun run check
      - name: Test documentation links and candidate source instructions
        run: bun run test:docs
      - name: Audit tracked documentation, media and ignored outputs
        run: bun run test:repo
      - name: Test read-only WSL source detection (offline fixtures)
        run: python scripts/test-wsl-discovery.py
      - name: Test remote Codex metadata schemas (offline fixtures)
        run: python scripts/test-codex-metadata.py
      - name: Test opt-in Codex approval observer and reversible installation
        run: python scripts/test-codex-observer.py
      - name: Test WSL metadata freshness and read failures (offline fixtures)
        run: python scripts/wsl-metadata.test.py
      - name: Test frontend models
        run: bun run test:ui-model
      - name: Test integration contracts
        run: bun run test:integration-contract
      - name: Test smoke evidence and bounded owned-directory cleanup
        run: bun run test:smoke-cleanup
      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Lint Rust
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --bin agent-tray -- -D warnings
      - name: Test Rust
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --bin agent-tray
      - name: Build NSIS and MSI installers
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        with:
          tauriScript: bun run tauri
          args: --target x86_64-pc-windows-msvc --features custom-protocol --bundles nsis,msi -- --profile ci-release --locked
      - name: Test the actual GUI-subsystem release bridge with redirected stdin
        run: bun scripts/integration-bridge-smoke.ts --exe src-tauri/target/x86_64-pc-windows-msvc/ci-release/agent-tray.exe --require-gui
      - name: Test MCP in the GUI-subsystem executable
        run: python scripts/mcp-smoke.py --exe src-tauri/target/x86_64-pc-windows-msvc/ci-release/agent-tray.exe
      - name: Normalize asset names and generate flat checksums
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
          RELEASE_COMMIT: ${{ needs.preflight.outputs.commit }}
        run: bun scripts/release.ts stage --bundle-root src-tauri/target/x86_64-pc-windows-msvc/ci-release/bundle --out dist/release --version "$env:RELEASE_VERSION" --commit "$env:RELEASE_COMMIT" ${{ needs.preflight.outputs.tag == '' && '--untagged' || '' }}
      - name: Export dependency inventory and license texts
        run: bun scripts/dependency-notices.ts dist/release x86_64-pc-windows-msvc
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-installers
          path: dist/release/*
          if-no-files-found: error

  installer-smoke:
    name: Verify ${{ matrix.installer }} on a fresh Windows runner (round ${{ matrix.round }})
    needs: [preflight, windows]
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        installer: [nsis, msi]
        round: [1, 2]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.preflight.outputs.probe_commit || needs.preflight.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: windows-installers
          path: dist/release
      - name: Prepare ordinary-user WebView2 acceptance on the disposable runner
        shell: pwsh
        run: |
          $gsudo = Get-Command gsudo.exe -ErrorAction SilentlyContinue
          if ($gsudo) { $gsudoPath = $gsudo.Source } else {
            winget install --id gerardog.gsudo --exact --source winget --accept-source-agreements --accept-package-agreements --disable-interactivity
            if ($LASTEXITCODE -ne 0) { throw 'Could not install CI de-elevation helper' }
            $gsudoPath = Join-Path $env:ProgramFiles 'gsudo\Current\gsudo.exe'
          }
          if (-not (Test-Path -LiteralPath $gsudoPath)) { throw 'Missing CI de-elevation helper' }
          "GSUDO_EXE=$gsudoPath" >> $env:GITHUB_ENV
          $ciAccount = [Security.Principal.WindowsIdentity]::GetCurrent().Name
          icacls "$env:GITHUB_WORKSPACE" /grant "${ciAccount}:(OI)(CI)M"
          if ($LASTEXITCODE -ne 0) { throw 'Could not grant the runner account access to acceptance evidence' }
      - name: Exercise the real installer (not the build-tree executable)
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
          INSTALLER_KIND: ${{ matrix.installer }}
          TASKPULSE_PROBE_COMMIT: ${{ needs.preflight.outputs.probe_commit || needs.preflight.outputs.commit }}
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/installer-smoke.ps1 -Assets dist/release -Version "$env:RELEASE_VERSION" -Gsudo "$env:GSUDO_EXE" -InstallerKind "$env:INSTALLER_KIND"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: windows-installer-evidence-${{ matrix.installer }}-${{ matrix.round }}
          path: dist/installer-smoke/
          if-no-files-found: warn

  draft:
    name: Create a draft pre-release only
    if: ${{ needs.preflight.outputs.tag != '' }}
    needs: [preflight, windows, installer-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.preflight.outputs.commit }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.0"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: windows-installers
          path: dist/release
      - name: Verify final uploaded assets
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
        run: bun scripts/release.ts verify --out dist/release --version "$RELEASE_VERSION"
      - name: Create draft (manual acceptance required before publishing)
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ needs.preflight.outputs.tag }}
          target_commitish: ${{ needs.preflight.outputs.commit }}
          name: TaskPulse ${{ needs.preflight.outputs.tag }} · Windows Alpha
          draft: true
          prerelease: true
          make_latest: false
          body_path: docs/releases/${{ needs.preflight.outputs.version }}.md
          fail_on_unmatched_files: true
          files: |
            dist/release/*.exe
            dist/release/*.msi
            dist/release/SHA256SUMS.txt
            dist/release/release-manifest.json
            dist/release/DEPENDENCIES.json
            dist/release/SBOM.cdx.json
            dist/release/THIRD_PARTY_NOTICES.txt
