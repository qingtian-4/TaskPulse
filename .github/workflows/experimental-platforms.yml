name: Experimental Linux and macOS bundles

# Compatibility builds are opt-in artifacts, never a stable support claim or
# a prerequisite of the Windows release. No Apple signing secrets are required.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
            args: --bundles deb,rpm,appimage
          - os: macos-latest
            platform: macos-arm64
            args: --bundles app,dmg
          - os: macos-latest
            platform: macos-x64
            args: --target x86_64-apple-darwin --bundles app,dmg
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: ${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || 'x86_64-unknown-linux-gnu' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev clang lld rpm
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run test:ui-model
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --bin agent-tray -- -D warnings
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --bin agent-tray
      - name: Build unsigned experimental bundles
        uses: tauri-apps/tauri-action@v0
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        with:
          tauriScript: bun run tauri
          args: ${{ matrix.args }} --features custom-protocol -- --profile ci-release --locked
      - uses: actions/upload-artifact@v7
        with:
          name: experimental-${{ matrix.platform }}-${{ github.sha }}
          if-no-files-found: error
          path: |
            src-tauri/target/**/bundle/**/*.deb
            src-tauri/target/**/bundle/**/*.rpm
            src-tauri/target/**/bundle/**/*.AppImage
            src-tauri/target/**/bundle/**/*.dmg
