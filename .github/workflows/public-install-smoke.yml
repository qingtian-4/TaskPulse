name: Public command-line installation

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Current public stable tag to validate through README commands'
        required: true
        default: 'v1.0.0'

permissions:
  contents: read

jobs:
  install:
    if: github.event_name == 'workflow_dispatch' || github.event.release.prerelease == false
    name: Public install on ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, name: windows-x64}
          - {os: macos-15, name: macos-arm64}
          - {os: macos-15-intel, name: macos-x64}
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Validate explicit stable tag
        shell: bash
        run: |
          if ! [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo 'An explicit stable tag is required' >&2
            exit 1
          fi
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - name: Prepare medium-integrity Windows runtime acceptance
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $gsudo = Get-Command gsudo.exe -ErrorAction SilentlyContinue
          if ($gsudo) { $path = $gsudo.Source } else {
            winget install --id gerardog.gsudo --exact --source winget --accept-source-agreements --accept-package-agreements --disable-interactivity
            if ($LASTEXITCODE -ne 0) { throw 'Could not install CI de-elevation helper' }
            $path = Join-Path $env:ProgramFiles 'gsudo\Current\gsudo.exe'
          }
          if (-not (Test-Path -LiteralPath $path)) { throw 'Missing CI de-elevation helper' }
          "GSUDO_EXE=$path" >> $env:GITHUB_ENV
          $ciAccount = [Security.Principal.WindowsIdentity]::GetCurrent().Name
          icacls "$env:GITHUB_WORKSPACE" /grant "${ciAccount}:(OI)(CI)M"
          if ($LASTEXITCODE -ne 0) { throw 'Could not grant the runner account access to acceptance scripts' }
      - name: Install Windows through the public bootstrap and verify the installed application
        if: runner.os == 'Windows'
        shell: pwsh
        run: python scripts/public-install-smoke.py --tag "$env:RELEASE_TAG" --out dist/public-install --gsudo "$env:GSUDO_EXE"
      - name: Install macOS through the public bootstrap with native system tools
        if: runner.os == 'macOS'
        run: python3 scripts/public-install-smoke.py --tag "$RELEASE_TAG" --out dist/public-install
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: public-install-${{ matrix.name }}-${{ github.run_id }}
          path: |
            dist/public-install/
            dist/installer-smoke/
          if-no-files-found: warn
