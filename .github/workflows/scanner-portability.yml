name: Scanner macOS compile boundary

on:
  pull_request:
    paths:
      - 'src-tauri/src/scanner/**'
      - 'src-tauri/src/process/**'
      - 'src-tauri/src/process.rs'
      - 'src-tauri/Cargo.toml'
      - 'src-tauri/Cargo.lock'
      - '.github/workflows/scanner-portability.yml'
  push:
    branches: ['codex/**']
    paths:
      - 'src-tauri/src/scanner/**'
      - 'src-tauri/src/process/**'
      - 'src-tauri/src/process.rs'
      - 'src-tauri/Cargo.toml'
      - 'src-tauri/Cargo.lock'
      - '.github/workflows/scanner-portability.yml'

permissions:
  contents: read

concurrency:
  group: scanner-portability-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  macos-check:
    name: macOS compile only (no runtime acceptance)
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "1.98.0"
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
      - run: cargo check --locked --manifest-path src-tauri/Cargo.toml --bin agent-tray --tests
      # No bundles, signing, application launch, or macOS support claim.
