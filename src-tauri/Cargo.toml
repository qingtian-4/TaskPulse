[package]
name        = "agent-tray"
version     = "0.2.0-alpha.8"
edition     = "2021"
rust-version = "1.89"
description = "TaskPulse - Attention dashboard for AI coding-agent tasks"
license = "MIT"
repository = "https://github.com/qingtian-4/TaskPulse"
readme = "../README.md"

[features]
# Standalone builds embed frontendDist; `tauri dev` retains the dev server path.
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
tauri                     = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-global-shortcut = "2"
notify-rust               = "4.18.2"
notify                    = "8"
serde                     = { version = "1", features = ["derive"] }
serde_json                = "1"
toml                      = "0.8"
toml_edit                 = "0.25"
rusqlite                  = { version = "0.32", features = ["bundled"] }
zstd                      = "0.14.3"
base64                    = "0.22"
sha2                      = "0.10"
dirs-next                 = "2"
log                       = "0.4"
env_logger                = "0.11"
tauri-plugin-window-state = "2.4.1"
tempfile                  = "3"

[target.'cfg(target_os = "windows")'.dependencies]
winrt-notification = { package = "tauri-winrt-notification", version = "0.8.1" }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level     = "z"
lto           = "thin"
strip         = true
codegen-units = 1
panic         = "unwind"

[profile.ci-release]
inherits      = "release"
lto           = "thin"
codegen-units = 16
opt-level     = "s"
