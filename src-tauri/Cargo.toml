[package]
name        = "agent-tray"
version     = "0.2.0-alpha.4"
edition     = "2021"
rust-version = "1.89"
description = "TaskPulse - Attention dashboard for AI coding-agent tasks"

[features]
# Standalone builds embed frontendDist; `tauri dev` retains the dev server path.
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
tauri                     = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-shell        = "2"
tauri-plugin-process      = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification    = "2"
notify-rust               = "4"
notify                    = "8"
serde                     = { version = "1", features = ["derive"] }
serde_json                = "1"
toml                      = "0.8"
rusqlite                  = { version = "0.32", features = ["bundled"] }
zstd                      = "0.13"
base64                    = "0.22"
dirs-next                 = "2"
log                       = "0.4"
env_logger                = "0.11"
tauri-plugin-window-state = "2.4.1"
tempfile                  = "3"

[target.'cfg(target_os = "windows")'.dependencies]
winrt-notification = { package = "tauri-winrt-notification", version = "0.7.2" }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
opt-level     = "z"
lto           = "thin"
strip         = true
codegen-units = 1
panic         = "unwind"

[profile.ci-release]
inherits      = "release"
lto           = "thin"
codegen-units = 16
opt-level     = "s"
